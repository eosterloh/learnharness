name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "scripts/build-android-apk.sh"
      - ".github/workflows/android-apk.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  apk:
    name: Signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LH_ANDROID_DEFAULT_SERVER_URL: ${{ vars.LH_ANDROID_DEFAULT_SERVER_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      LH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LH_ANDROID_KEYSTORE_PASSWORD }}
      LH_ANDROID_KEY_ALIAS: ${{ secrets.LH_ANDROID_KEY_ALIAS }}
      LH_ANDROID_KEY_PASSWORD: ${{ secrets.LH_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Keystore from secrets, or a throwaway CI key
        run: |
          if [ -z "${LH_ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "LH_ANDROID_KEYSTORE_PASSWORD=ci-learnharness" >> "$GITHUB_ENV"
            echo "LH_ANDROID_KEY_ALIAS=learnharness" >> "$GITHUB_ENV"
            echo "LH_ANDROID_KEY_PASSWORD=ci-learnharness" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: bash scripts/build-android-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LearnHarness-apk
          path: dist/LearnHarness.apk
          if-no-files-found: error
